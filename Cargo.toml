[package]
name = "irq-affinity"
version = "3.1.0"
edition = "2021"
authors = ["Nicola Bonelli <nicola.bonelli@gmail.com>"]
description = "A Linux interrupt and XPS affinity binding tool and library"
license = "GPL-2.0-or-later"

[lib]
name = "irq_affinity"
path = "src/lib.rs"

[[bin]]
name = "irq-affinity"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
regex = "1.10"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
